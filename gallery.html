  <script src='https://cdnjs.cloudflare.com/ajax/libs/mixitup/3.2.2/mixitup.min.js'></script>

  <!-- Fancybox js -->
<script>
  const ITEMS_PER_PAGE = 12;
  const MAX_VISIBLE_PAGES = 4;

  const containerEl = document.querySelector(".gallery-grid");
  const paginationEl = document.querySelector(".gallery-pagination");

  let currentPage = 1;
  let totalPages = 1;
  let currentItems = [];

  const mixer = mixitup(containerEl, {
    animation: {
      effects: "fade translateZ(-100px)",
      effectsIn: "fade translateY(-100%)",
      easing: "cubic-bezier(0.645, 0.045, 0.355, 1)"
    },
    callbacks: {
      onMixEnd: paginate
    }
  });

  function paginate() {
    currentItems = [...containerEl.querySelectorAll(".mix:not(.mixitup-hidden)")];
    totalPages = Math.ceil(currentItems.length / ITEMS_PER_PAGE);
    currentPage = 1;

    renderPage();
    renderPagination();
  }

  function renderPage() {
    currentItems.forEach(item => item.classList.add("fade-out"));

    setTimeout(() => {
      currentItems.forEach((item, index) => {
        const start = (currentPage - 1) * ITEMS_PER_PAGE;
        const end = currentPage * ITEMS_PER_PAGE;

        const visible = index >= start && index < end;
        item.style.display = visible ? "block" : "none";

        item.classList.remove("fade-out");
        if (visible) item.classList.add("fade-in");
      });
    }, 150);
  }

  function renderPagination() {
    paginationEl.innerHTML = "";
    if (totalPages <= 1) return;

    // Prev
    paginationEl.appendChild(createButton("Prev", currentPage === 1, () => changePage(currentPage - 1)));

    let start = Math.max(1, currentPage - 1);
    let end = Math.min(totalPages, start + MAX_VISIBLE_PAGES - 1);

    if (end - start < MAX_VISIBLE_PAGES - 1) {
      start = Math.max(1, end - MAX_VISIBLE_PAGES + 1);
    }

    if (start > 1) {
      paginationEl.appendChild(createButton("1", false, () => changePage(1)));
      if (start > 2) paginationEl.appendChild(createEllipsis());
    }

    for (let i = start; i <= end; i++) {
      paginationEl.appendChild(
        createButton(i, false, () => changePage(i), i === currentPage)
      );
    }

    if (end < totalPages) {
      if (end < totalPages - 1) paginationEl.appendChild(createEllipsis());
      paginationEl.appendChild(createButton(totalPages, false, () => changePage(totalPages)));
    }

    // Next
    paginationEl.appendChild(createButton("Next", currentPage === totalPages, () => changePage(currentPage + 1)));
  }

  function createButton(text, disabled, onClick, active = false) {
    const btn = document.createElement("button");
    btn.textContent = text;
    btn.disabled = disabled;
    if (active) btn.classList.add("active");
    btn.onclick = onClick;
    return btn;
  }

  function createEllipsis() {
    const span = document.createElement("span");
    span.textContent = "…";
    span.style.margin = "0 6px";
    return span;
  }

  function changePage(page) {
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    renderPage();
    renderPagination();
  }

  // Keyboard navigation
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") changePage(currentPage + 1);
    if (e.key === "ArrowLeft") changePage(currentPage - 1);
  });

  // Init
  window.addEventListener("load", paginate);
</script>
